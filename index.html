<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No user zoom: a double-tap that zooms the arena mid-fight is a lost run,
         and viewport-fit lets the sticks reach into the notch area. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0908" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Overwritten at boot with the player's language; here for the first paint
         and for anything that reads the document before the module runs. -->
    <title>ASCEND — ECUMENE, the last council of the dead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cinzel and EB Garamond are the marble pass. Cormorant is the gate: the
         setup screen is drawn from a separate design, and its small-caps face
         does the letterspaced-capitals job Cinzel cannot at 74px. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cormorant+SC:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <!-- Second: the ECUMENE pass restyles what the base sheet lays out. -->
    <link rel="stylesheet" href="/src/ui/ecumene.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
